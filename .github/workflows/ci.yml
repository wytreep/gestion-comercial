name: CI

on:
  push:
    # Todas las ramas: permite validar una rama antes de abrir el PR.
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · sintaxis, tests y auditoría
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Comprobar sintaxis
        run: composer lint

      - name: Pruebas unitarias
        run: composer test

      - name: Auditoría estática ligera
        run: composer audit:static

      - name: Vulnerabilidades en dependencias
        run: composer audit --no-dev

  client:
    name: Cliente · TypeScript y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (tsc + vite)
        run: npm run build

  imagen:
    name: Imagen PHP · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen de producción
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          push: false
          tags: gcom-php:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
