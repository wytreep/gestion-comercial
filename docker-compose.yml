# Entorno de DESARROLLO — donde se rompen cosas sin consecuencias.
#
#   docker compose up -d        -> http://localhost:8081
#   cd client && npm run dev    -> http://localhost:5173 (proxy a 8081)
#
# La operación del cliente vive en compose.ops.yaml (puerto 8080) y no comparte
# ni contenedores, ni base de datos, ni código: este archivo monta el código del
# host como volumen, así que cada guardado se aplica al instante.
#
# La base de datos de desarrollo es un volumen aparte (gc_dev_db_data) que nace
# vacío. Para llenarlo: database/seeds/demo_catalogo.sql y
# bin/reset-admin-password.php --create (ver docs/09-despliegue.md).
name: gc-dev

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: gcom_dev_nginx
    ports: [ "${DEV_PORT:-8081}:80" ]
    depends_on: [ php ]
    networks: [ gcom_net ]
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gcom_dev_php
    volumes:
      - "./backend:/var/www:cached"
      # Conserva el vendor instalado en la imagen aunque el bind mount tape /var/www
      - "/var/www/vendor"
    env_file: [ .env ]
    depends_on:
      db: { condition: service_healthy }
    networks: [ gcom_net ]
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: gcom_dev_db
    # Sin puerto publicado: MySQL solo es accesible desde la red interna de
    # Docker. Para una consola usa: docker compose exec db mysql -u root -p
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-gestion_comercial}
      MYSQL_USER: ${DB_USER:-gcom_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    volumes:
      - gcom_db_data:/var/lib/mysql
      # Las migraciones se ejecutan en orden alfabético solo al crear el
      # volumen. Los dumps con datos reales viven en database/private y se
      # importan a mano.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [ gcom_net ]
    restart: unless-stopped

networks:
  gcom_net:
    driver: bridge

volumes:
  gcom_db_data:
    name: gc_dev_db_data
    driver: local
