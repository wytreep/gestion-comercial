<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Mockup de la pantalla de inicio de sesión">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#f4f6f9"/>
  <rect width="1440" height="3" fill="#0b5cab"/>

  <!-- Marca -->
  <rect x="633" y="249" width="40" height="40" rx="4" fill="#0b5cab" filter="url(#logoShadow)"/>
  <rect x="645" y="266" width="4" height="10" rx="1" fill="#ffffff"/>
  <rect x="652" y="261" width="4" height="15" rx="1" fill="#ffffff"/>
  <rect x="659" y="264" width="4" height="12" rx="1" fill="#ffffff"/>

  <text x="686" y="266" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Gestión Comercial</text>
  <text x="686" y="281" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.6" fill="#64748b">ERP DE DISTRIBUCIÓN</text>

  <!-- Tarjeta de acceso -->
  <rect x="535" y="316" width="370" height="302" rx="6" fill="#ffffff" stroke="#dfe4ea" filter="url(#cardShadow)"/>
  <line x1="535" y1="390" x2="905" y2="390" stroke="#dfe4ea"/>

  <text x="556" y="342" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Iniciar sesión</text>
  <text x="556" y="360" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Accede con tu cuenta corporativa.</text>

  <text x="556" y="412" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#64748b">CORREO ELECTRÓNICO</text>
  <rect x="556" y="424" width="328" height="42" rx="4" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="568" y="450" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#94a3b8">nombre@empresa.com</text>

  <text x="556" y="492" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#64748b">CONTRASEÑA</text>
  <rect x="556" y="504" width="328" height="42" rx="4" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="568" y="530" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#94a3b8">••••••••</text>

  <rect x="556" y="560" width="328" height="40" rx="4" fill="#0b5cab"/>
  <g transform="translate(688,574)" stroke="#ffffff" stroke-width="1.2" fill="none">
    <rect x="0" y="4" width="10" height="7" rx="1"/>
    <path d="M2 4 V2.5 a3 3 0 0 1 6 0 V4"/>
    <circle cx="5" cy="7.5" r="1" fill="#ffffff" stroke="none"/>
  </g>
  <text x="706" y="585" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Ingresar</text>

  <!-- Pie -->
  <g transform="translate(614,641)" stroke="#94a3b8" stroke-width="1.2" fill="none">
    <rect x="0" y="4" width="10" height="7" rx="1"/>
    <path d="M2 4 V2.5 a3 3 0 0 1 6 0 V4"/>
  </g>
  <text x="630" y="650" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#94a3b8">Acceso restringido · Gestión Comercial</text>

  <text x="1400" y="888" text-anchor="end" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="8" fill="#cbd5e1">Mockup · Inicio de sesión</text>
</svg>
