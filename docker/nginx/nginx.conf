server {
    listen 80;
    server_name _;

    # SPA compilada por docker/nginx/Dockerfile
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 20M;

    # No revelar versión ni detalles del servidor.
    server_tokens off;

    # ── Cabeceras de seguridad ────────────────────────────
    # La CSP no permite scripts en línea: el tema inicial vive en
    # /tema-inicio.js y los estilos de React (atributos style) sí necesitan
    # 'unsafe-inline' en style-src. Si un location define su propio
    # add_header, nginx deja de heredar estos: no añadir add_header sueltos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # API PHP: todo /api/* lo atiende backend/public/index.php
    location /api/ {
        include fastcgi_params;

        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     $request_uri;

        # CRÍTICO: pasar el header Authorization a PHP
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;

        # La API nunca se guarda en caché.
        expires -1;
    }

    # Rutas del SPA (React Router). El HTML se revalida siempre para que un
    # despliegue se vea en la siguiente carga.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash de Vite: caché larga.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
    }

    location ~ /\.ht {
        deny all;
    }
}
